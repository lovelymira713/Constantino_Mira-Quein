<!DOCTYPE html>
<html>
<head>
<title>Inventory Management System</title>

<style>
body{
    font-family: Arial;
    background-color:#f5f5f5;
    padding:30px;
}

table{
    width:100%;
    border-collapse: collapse;
    margin-top:20px;
}

th, td{
    border:1px solid gray;
    padding:10px;
    text-align:left;
}

th{
    background-color:#333;
    color:white;
}

button{
    padding:8px;
    background-color:green;
    color:white;
    border:none;
}

.out{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Inventory Management System</h2>

<form id="productForm">

<input type="text" id="name" placeholder="Product Name" required>
<input type="number" id="price" placeholder="Price" required>
<input type="number" id="stock" placeholder="Stock Quantity" required>

<button type="submit">Add Product</button>

</form>

<table>

<thead>
<tr>
<th>ID</th>
<th>Item Name</th>
<th>Price</th>
<th>Stock</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

<script>

let inventorySystem = {

inventory : [
    {id:1, name:"Wireless Mouse", price:25, stock:10},
    {id:2, name:"Keyboard", price:45, stock:0},
    {id:3, name:"Monitor", price:500, stock:20},
    {id:4, name:"RTX 9090", price:1000000, stock:1},
    {id:5, name:"Gaming Speakers", price:12345, stock:123}
],


renderTable : function(){

let tbody = document.getElementById("tableBody");

tbody.innerHTML = "";

this.inventory.forEach(function(product){

let stockText;

if(product.stock == 0){
    stockText = "<span class='out'>Out of Stock</span>";
}else{
    stockText = product.stock;
}

let row = `
<tr>
<td>${product.id}</td>
<td>${product.name}</td>
<td>$${product.price}</td>
<td>${stockText}</td>
</tr>
`;

tbody.innerHTML += row;

});

},

addProduct : function(name, price, stock){

let newProduct = {
    id: this.inventory.length + 1,
    name: name,
    price: parseFloat(price),
    stock: parseInt(stock)
};

this.inventory.push(newProduct);

this.renderTable();

}

};

document.getElementById("productForm").addEventListener("submit", function(e){

e.preventDefault();

let name = document.getElementById("name").value;
let price = document.getElementById("price").value;
let stock = document.getElementById("stock").value;

inventorySystem.addProduct(name, price, stock);

this.reset();

});


// INITIAL DISPLAY
inventorySystem.renderTable();

</script>

</body>
</html>
