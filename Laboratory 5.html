
<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>

    <style>
      body {
        background-color: #ffe6f2;
        font-family: "Times New Roman", Times, serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: linear-gradient(#ffffff, #fff0f5);
        padding: 30px;
        border-radius: 20px;
        width: 300px;
        box-shadow: 0 10px 25px rgba(214, 51, 108, 0.3);
        border: 2px solid #ffb3cc;
      }

      .title {
        text-align: center;
        color: #d6336c;
        margin-bottom: 20px;
        font-size: 26px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 12px;
        border: 1px solid #ff99bb;
        font-size: 18px;
        text-align: right;
        font-family: "Times New Roman", Times, serif;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        padding: 12px;
        font-size: 18px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(to right, #ff4d88, #ff85a2);
        color: white;
        cursor: pointer;
        font-family: "Times New Roman", Times, serif;
      }

      button:hover {
        background: linear-gradient(to right, #e6005c, #ff4d88);
      }
 .zero { grid-column: span 2; }
    .c { grid-column: span 2; }
    
    .equal { grid-column: span 2; }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="title">Calculator</h1>

    <input type="text" id="display" readonly>

    <div class="buttons">
     
      <button onclick="press('7')">7</button>
      <button onclick="press('8')">8</button>
      <button onclick="press('9')">9</button>
      <button onclick="press('/')">÷</button>

      <button onclick="press('4')">4</button>
      <button onclick="press('5')">5</button>
      <button onclick="press('6')">6</button>
      <button onclick="press('*')">x</button>

      <button onclick="press('1')">1</button>
      <button onclick="press('2')">2</button>
      <button onclick="press('3')">3</button>
      <button onclick="press('-')">-</button>

      <button class="zero" onclick="press('0')">0</button>
      <button onclick="press('.')">.</button>
      <button  onclick="press('+')">+</button>
      

      <button class="c" onclick="clearDisplay()">C</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
  let display = document.getElementById("display");

  function press(value) {
    display.value += value;
  }

  function clearDisplay() {
    display.value = "";
    alert("Page has been reset!");
  }

  function calculate() {
    let exp = display.value;
    let ans = eval(exp);

    if (exp.indexOf("+") != -1 && exp.length > 5) {
      let r = Math.floor(Math.random() * 3) - 1; 
      ans = ans + r;
    }

    display.value = ans;
  }
</script>
        
</body>
</html>
